spring.application.name=club-system

# Google Cloud SQL (PostgreSQL)

# 최초 실행 전: 구글 클라우드  계정 연결,
#=====
# db연결주소 설정하는 코드 postgresql을 사용함, db서버주소 127.0.0.1, 포트는 5432/club_db라는 db에 접속함. 
#spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/club_db
spring.datasource.url=jdbc:postgresql://localhost:5433/club_db
spring.datasource.username=club_admin
spring.datasource.password=OracleXE2024!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# 최초 실행 시: create / 이후: none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 샘플 데이터 초기 삽입: always → 이후 never
spring.sql.init.mode=never

# 이미지 업로드 저장 경로
app.upload.dir=${user.home}/club-uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DB 연결 실패 시 빠른 응답 (기본 30초 → 5초)
spring.datasource.hikari.connection-timeout=5000

# CORS
cors.allowed-origins=http://localhost:3000

server.port=8080

# JWT
jwt.secret=${JWT_SECRET:ClubSystem2024!SecretKey@JwtAuth#2team}
