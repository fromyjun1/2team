spring.application.name=club-system

# ── Google Cloud SQL (PostgreSQL) ────────────────────────────────
# Cloud SQL Auth Proxy를 먼저 실행해야 합니다.
# 실행 명령: cloud-sqlpproxy.x64.exe project-42919437-c0df-4eec-804:asia-northeast3:club-db --port=5432
#
# ※ 로컬에 PostgreSQL이 이미 설치되어 5432 포트를 사용 중이라면
#    Proxy를 --port=5433 으로 실행하고 아래 URL도 5433으로 변경하세요.
spring.datasource.url=jdbc:postgresql://localhost:5432/club_db
spring.datasource.username=club_admin
spring.datasource.password=OracleXE2024!
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=never

# ── 파일 업로드 (Google Cloud Storage) ───────────────────────────
app.gcs.bucket=club-system-images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── 기타 ─────────────────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
cors.allowed-origins=http://localhost:3000,http://172.17.58.8:3000
server.port=8080

# ── JWT ──────────────────────────────────────────────────────────
jwt.secret=ClubSystem2024!SecretKey@JwtAuth#2team

