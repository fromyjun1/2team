spring.application.name=club-system

# Google Cloud SQL (PostgreSQL)
# 최초 실행 전: Cloud SQL 승인 네트워크에 본인 IP 추가 필요
# gcloud sql instances patch club-db --authorized-networks="내IP/32"
spring.datasource.url=jdbc:postgresql://34.64.144.241:5432/club_db
spring.datasource.username=club_admin
spring.datasource.password=OracleXE2024!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# 최초 실행 시: create / 이후: none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# 샘플 데이터 초기 삽입: always → 이후 never
spring.sql.init.mode=never

# 이미지 업로드 저장 경로
app.upload.dir=${user.home}/club-uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DB 연결 실패 시 빠른 응답 (기본 30초 → 5초)
spring.datasource.hikari.connection-timeout=5000

# CORS
cors.allowed-origins=http://localhost:3000

server.port=8080

# JWT
jwt.secret=${JWT_SECRET:ClubSystem2024!SecretKey@JwtAuth#2team}
